# MyDesk: WhatsApp (QR / WhatsApp Web) gateway, Evolution API.
#
# Kept outside Chatwoot's own compose files on purpose: it is a separate Docker project
# (`mydesk-whatsapp`) that only talks to Chatwoot through its public API and an API-channel
# inbox webhook, so upstream Chatwoot updates never touch or remove it.
#
#   docker compose -f deploy/whatsapp/docker-compose.yaml -p mydesk-whatsapp up -d
#
# Manager UI (instances, QR codes): http://localhost:8080/manager
name: mydesk-whatsapp

services:
  evolution-api:
    # Pinned: 2.4+ requires activation against the Evolution Foundation licensing server
    image: evoapicloud/evolution-api:v2.3.7
    container_name: mydesk-evolution-api
    restart: unless-stopped
    # Wait for the platform before connecting to WhatsApp: messages that arrive while Rails is down are stored here
    # but never delivered (recover them with recover_lost.sh). The image's own entrypoint runs after the wait.
    entrypoint:
      - /bin/bash
      - -c
      - |
        until wget -q -O /dev/null "$${CHATWOOT_WAIT_URL:-http://rails:3000/api}"; do
          echo "Waiting for the platform at $${CHATWOOT_WAIT_URL:-http://rails:3000/api}"; sleep 5
        done
        . ./Docker/scripts/deploy_database.sh && exec npm run start:prod
    env_file: .env
    ports:
      - '8080:8080'
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - chatwoot

volumes:
  evolution_instances:

networks:
  # Join Chatwoot's network so both sides reach each other by service name
  # (evolution-api -> rails:3000, postgres, redis; sidekiq -> evolution-api:8080)
  chatwoot:
    external: true
    name: ${CHATWOOT_NETWORK:-chatwoot_default}
